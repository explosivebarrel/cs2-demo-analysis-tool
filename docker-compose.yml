services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./demo-examples:/data/inbox:ro
      - cs2_store:/data/store
    expose:
      - "8000"
    environment:
      - CS2_DATA_DIR=/data/store
      - CS2_INBOX_DIR=/data/inbox

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  cs2_store:
