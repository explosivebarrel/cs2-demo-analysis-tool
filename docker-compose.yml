services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./demo-examples:/data/inbox:ro
      - cs2_store:/data/store
      # auto-import watch dir: mount your folder and set CS2_WATCH_DIRS=/watch
      # - C:/Users/you/cs2-demos:/watch:ro
    expose:
      - "8000"
    environment:
      - CS2_DATA_DIR=/data/store
      - CS2_INBOX_DIR=/data/inbox
      # analysis knobs (see .env.example)
      - CS2_MAX_CONCURRENT_ANALYZES=${CS2_MAX_CONCURRENT_ANALYZES:-0}
      - CS2_FRAME_SECONDS=${CS2_FRAME_SECONDS:-0.125}
      - CS2_MAX_UPLOAD_MB=${CS2_MAX_UPLOAD_MB:-1200}
      # auto-import (all optional): CS2_WATCH_DIRS is a pathsep-separated list
      # of dirs *inside* the container (mount host folders as volumes above);
      # FACEIT needs a free API key (FACEIT Developer Portal -> App Studio ->
      # your app -> API Keys) and your player id (FACEIT profile page URL)
      - CS2_WATCH_DIRS=${CS2_WATCH_DIRS:-}
      - CS2_WATCH_POLL_SEC=${CS2_WATCH_POLL_SEC:-20}
      - CS2_FACEIT_API_KEY=${CS2_FACEIT_API_KEY:-}
      - CS2_FACEIT_PLAYER_ID=${CS2_FACEIT_PLAYER_ID:-}
      - CS2_FACEIT_POLL_SEC=${CS2_FACEIT_POLL_SEC:-300}

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  cs2_store:
